<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>nuri. admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Dancing+Script:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --cream: #FAF6F0; --warm-beige: #F0E8DC; --border: #E4D9CC;
  --brown: #5C3D2E; --tan: #C4A882;
  --text: #2C1810; --text-mid: #6B4D3C; --text-light: #9C7B6A;
  --white: #FFFFFF;
  --shadow: 0 2px 12px rgba(44,24,16,0.08);
  --shadow-md: 0 4px 24px rgba(44,24,16,0.12);
  --radius: 14px; --radius-sm: 8px;
  --font-serif: 'Cormorant Garamond', Georgia, serif;
  --font-script: 'Dancing Script', cursive;
  --font-body: 'Inter', system-ui, sans-serif;
}
html { font-size: 16px; -webkit-font-smoothing: antialiased; }
body { background: var(--cream); color: var(--text); font-family: var(--font-body); min-height: 100vh; }

/* ── NAV ── */
.nav { position: sticky; top: 0; z-index: 100; background: rgba(250,246,240,0.97); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); padding: 0 32px; height: 60px; display: flex; align-items: center; justify-content: space-between; }
.nav-logo { font-family: var(--font-serif); font-size: 22px; font-style: italic; font-weight: 600; color: var(--text); }
.nav-tag { font-family: var(--font-script); font-size: 15px; color: var(--tan); }
.nav-right { display: flex; align-items: center; gap: 12px; }
.nav-btn { padding: 8px 18px; border-radius: 50px; font-family: var(--font-body); font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
.nav-btn-ghost { background: transparent; border: 1.5px solid var(--border); color: var(--text-mid); }
.nav-btn-ghost:hover { border-color: var(--brown); color: var(--brown); }
.nav-btn-primary { background: var(--brown); color: white; }
.nav-btn-primary:hover { background: #4A3024; }

/* ── LOGIN ── */
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.login-card { background: var(--white); border-radius: 20px; padding: 48px; width: 100%; max-width: 400px; box-shadow: var(--shadow-md); text-align: center; }
.login-leaf { font-size: 40px; margin-bottom: 16px; }
.login-title { font-family: var(--font-serif); font-size: 32px; font-style: italic; color: var(--text); margin-bottom: 6px; }
.login-sub { font-size: 13px; color: var(--text-light); margin-bottom: 32px; }
.login-input { width: 100%; padding: 13px 16px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-family: var(--font-body); font-size: 15px; color: var(--text); outline: none; margin-bottom: 14px; background: var(--cream); }
.login-input:focus { border-color: var(--brown); }
.login-btn { width: 100%; padding: 14px; background: var(--brown); color: white; border: none; border-radius: 50px; font-family: var(--font-body); font-size: 15px; font-weight: 600; cursor: pointer; }
.login-btn:hover { background: #4A3024; }
.login-error { color: #C0392B; font-size: 13px; margin-top: 10px; }

/* ── LAYOUT ── */
.admin-wrap { max-width: 1100px; margin: 0 auto; padding: 40px 24px 80px; }
.admin-header { margin-bottom: 36px; }
.admin-header h1 { font-family: var(--font-serif); font-size: 36px; font-style: italic; color: var(--text); margin-bottom: 6px; }
.admin-header p { color: var(--text-light); font-size: 14px; }

.tabs { display: flex; gap: 8px; margin-bottom: 32px; border-bottom: 1px solid var(--border); padding-bottom: 0; }
.tab { padding: 10px 20px; border: none; background: none; font-family: var(--font-body); font-size: 14px; font-weight: 500; color: var(--text-light); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.active { color: var(--brown); border-bottom-color: var(--brown); font-weight: 600; }

/* ── FORM ── */
.form-card { background: var(--white); border-radius: var(--radius); padding: 32px; box-shadow: var(--shadow); }
.form-section { margin-bottom: 28px; }
.form-section-title { font-family: var(--font-serif); font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.form-group.full { grid-column: 1 / -1; }
.form-label { font-size: 12px; font-weight: 600; color: var(--text-mid); letter-spacing: 0.04em; text-transform: uppercase; }
.form-input, .form-select, .form-textarea {
  padding: 10px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  background: var(--cream); font-family: var(--font-body); font-size: 14px; color: var(--text);
  outline: none; width: 100%; transition: border-color 0.15s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--brown); background: white; }
.form-textarea { resize: vertical; line-height: 1.6; min-height: 90px; }
.form-hint { font-size: 11px; color: var(--text-light); margin-top: 3px; }

/* ── HEALTH LABELS ── */
.label-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.label-chip { padding: 7px 14px; border-radius: 50px; border: 1.5px solid var(--border); background: var(--white); font-size: 12px; font-weight: 500; color: var(--text-mid); cursor: pointer; transition: all 0.15s; user-select: none; }
.label-chip:hover { border-color: var(--tan); }
.label-chip.active { border-color: var(--brown); background: var(--warm-beige); color: var(--brown); font-weight: 600; }

/* ── DYNAMIC LISTS ── */
.list-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.list-num { width: 26px; height: 26px; border-radius: 50%; background: var(--warm-beige); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--brown); flex-shrink: 0; }
.list-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--tan); flex-shrink: 0; }
.remove-btn { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--border); background: white; cursor: pointer; color: var(--text-light); font-size: 14px; flex-shrink: 0; transition: all 0.15s; }
.remove-btn:hover { border-color: #C0392B; color: #C0392B; }
.add-btn { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--warm-beige); border: 1.5px dashed var(--border); border-radius: var(--radius-sm); font-size: 13px; color: var(--text-mid); cursor: pointer; font-family: var(--font-body); width: 100%; margin-top: 4px; transition: all 0.15s; }
.add-btn:hover { border-color: var(--brown); color: var(--brown); }

/* ── EMOJI PICKER ── */
.emoji-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.emoji-btn { width: 44px; height: 44px; border-radius: 10px; border: 2px solid var(--border); background: var(--white); font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.emoji-btn:hover { transform: scale(1.1); border-color: var(--tan); }
.emoji-btn.active { border-color: var(--brown); background: var(--warm-beige); }

/* ── DIETICIAN PICKER ── */
.rd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.rd-card { padding: 14px; border-radius: var(--radius-sm); border: 2px solid var(--border); background: var(--white); cursor: pointer; transition: all 0.15s; }
.rd-card:hover { border-color: var(--tan); }
.rd-card.active { border-color: var(--brown); background: var(--warm-beige); }
.rd-name { font-weight: 600; font-size: 14px; color: var(--text); margin-bottom: 2px; }
.rd-creds { font-size: 12px; color: var(--text-light); }

/* ── SUBMIT ── */
.submit-row { display: flex; gap: 12px; align-items: center; justify-content: flex-end; margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border); }
.submit-btn { padding: 13px 36px; background: var(--brown); color: white; border: none; border-radius: 50px; font-family: var(--font-body); font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.submit-btn:hover { background: #4A3024; transform: translateY(-1px); }
.submit-btn:disabled { opacity: 0.4; cursor: default; transform: none; }
.cancel-btn { padding: 13px 24px; background: transparent; border: 1.5px solid var(--border); color: var(--text-mid); border-radius: 50px; font-family: var(--font-body); font-size: 14px; font-weight: 500; cursor: pointer; }
.cancel-btn:hover { border-color: var(--brown); color: var(--brown); }

/* ── SUCCESS TOAST ── */
.toast { position: fixed; bottom: 32px; right: 32px; background: var(--brown); color: white; padding: 14px 24px; border-radius: 50px; font-size: 14px; font-weight: 500; box-shadow: var(--shadow-md); animation: slideUp 0.3s ease; z-index: 999; }
@keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

/* ── RECIPE LIST ── */
.recipe-list { display: flex; flex-direction: column; gap: 12px; }
.recipe-row { background: var(--white); border-radius: var(--radius-sm); padding: 18px 20px; display: flex; align-items: center; gap: 16px; box-shadow: var(--shadow); }
.recipe-emoji { font-size: 28px; flex-shrink: 0; }
.recipe-info { flex: 1; min-width: 0; }
.recipe-title { font-family: var(--font-serif); font-size: 17px; font-style: italic; font-weight: 600; color: var(--text); }
.recipe-meta { font-size: 12px; color: var(--text-light); margin-top: 3px; }
.recipe-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.recipe-tag { padding: 2px 10px; border-radius: 50px; font-size: 11px; font-weight: 500; background: var(--warm-beige); color: var(--text-mid); }
.recipe-source { font-size: 11px; padding: 3px 10px; border-radius: 50px; background: var(--warm-beige); color: var(--text-light); flex-shrink: 0; }
.recipe-source.custom { background: #C8E6C4; color: #2E6B3E; font-weight: 600; }
.delete-btn { padding: 7px 14px; border: 1.5px solid #E4D9CC; border-radius: 50px; background: white; color: var(--text-light); font-size: 12px; font-weight: 500; cursor: pointer; flex-shrink: 0; font-family: var(--font-body); transition: all 0.15s; }
.delete-btn:hover { border-color: #C0392B; color: #C0392B; }
.empty-state { text-align: center; padding: 48px; color: var(--text-light); font-size: 14px; }

/* ── DIETICIAN FORM ── */
.color-grid { display: flex; flex-wrap: wrap; gap: 10px; }
.color-swatch { width: 36px; height: 36px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: all 0.15s; }
.color-swatch.active { border-color: var(--brown); box-shadow: 0 0 0 2px var(--brown); }

@media (max-width: 640px) {
  .form-grid { grid-template-columns: 1fr; }
  .admin-wrap { padding: 24px 16px 80px; }
  .rd-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<div id="app"></div>

<script>
const ADMIN_PASSWORD = 'nuri2025'
const STORAGE_KEY = 'nuri_custom_recipes'
const RD_STORAGE_KEY = 'nuri_custom_dieticians'

const HEALTH_LABELS = [
  { id: 'pcos', label: 'PCOS' },
  { id: 'endometriosis', label: 'Endometriosis' },
  { id: 'hormones', label: 'Hormones' },
  { id: 'fertility', label: 'Fertility' },
  { id: 'gut', label: 'Gut Health' },
  { id: 'thyroid', label: 'Thyroid' },
  { id: 'period', label: 'Period Health' },
  { id: 'energy', label: 'Energy' },
  { id: 'postpartum', label: 'Postpartum' },
  { id: 'menopause', label: 'Menopause' },
  { id: 'anti-inflammatory', label: 'Anti-Inflammatory' },
  { id: 'high-protein', label: 'High Protein' },
  { id: 'gut-friendly', label: 'Gut-Friendly' },
]

const EMOJIS = ['🥗','🍲','🥣','🍳','🥘','🫐','🍞','🥙','🌮','🍜','🥬','🐟','🍛','🫙','🧆','🍵','🥤','🍫','⚡','💜','✨','🌿','🍋','🥑']

const AVATAR_COLORS = ['#C4A882','#8FA888','#D4A5A5','#B8A0C8','#A0B8D4','#C8A060','#A8C5A0','#D4B8A0','#B0C8D4','#C8B0D4']

const BUILT_IN_RDS = [
  { id: 1, name: 'Emily', credentials: 'Co-founder', specialty: 'General' },
  { id: 2, name: 'Malaika', credentials: 'Co-founder', specialty: 'General' },
]

const GRADIENTS = [
  { label: 'Warm Peach', value: 'linear-gradient(145deg, #F5E6C8 0%, #DEB887 60%, #C8956C 100%)' },
  { label: 'Berry Pink', value: 'linear-gradient(145deg, #F5C8D5 0%, #E899B4 60%, #C86090 100%)' },
  { label: 'Sage Green', value: 'linear-gradient(145deg, #C8E6C4 0%, #8FBC8B 60%, #5A9A56 100%)' },
  { label: 'Golden', value: 'linear-gradient(145deg, #FFF3C4 0%, #FFD700 60%, #C8A000 100%)' },
  { label: 'Lavender', value: 'linear-gradient(145deg, #E8D5F0 0%, #B89FD4 60%, #8060B0 100%)' },
  { label: 'Terracotta', value: 'linear-gradient(145deg, #F5D5B0 0%, #D4956C 60%, #A86040 100%)' },
  { label: 'Sky Blue', value: 'linear-gradient(145deg, #B8D4E8 0%, #6090C0 60%, #305090 100%)' },
  { label: 'Chocolate', value: 'linear-gradient(145deg, #3D1A00 0%, #6B3A1F 60%, #8B5A3A 100%)' },
  { label: 'Mint', value: 'linear-gradient(145deg, #C4DEB8 0%, #7FB070 60%, #4A8040 100%)' },
  { label: 'Sunrise', value: 'linear-gradient(145deg, #FFD4BC 0%, #FF9B78 60%, #D46040 100%)' },
]

// ── STATE ──
let isLoggedIn = false
let activeTab = 'add' // add | recipes | dieticians | add-rd
let toast = null
let editingId = null // id of recipe being edited

// Recipe form state
let recipeForm = emptyRecipeForm()

// RD form state
let rdForm = emptyRdForm()

function emptyRecipeForm() {
  return {
    title: '', subtitle: '', emoji: '🥗',
    dieticianId: 1, isCustomRd: false,
    healthLabels: [],
    prepTime: '', cookTime: '', servings: '',
    gradient: GRADIENTS[0].value,
    ingredients: [''],
    instructions: [''],
    note: '',
  }
}

function emptyRdForm() {
  return {
    name: '', credentials: '', specialty: '', bio: '',
    initials: '', avatarColor: AVATAR_COLORS[0],
    tags: [],
  }
}

function getCustomRecipes() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]') } catch { return [] }
}

function getCustomRDs() {
  try { return JSON.parse(localStorage.getItem(RD_STORAGE_KEY) || '[]') } catch { return [] }
}

function saveRecipe() {
  let recipes = getCustomRecipes()
  if (editingId) {
    recipes = recipes.map(r => r.id === editingId ? { ...recipeForm, id: editingId, custom: true } : r)
    showToast('Recipe updated! ✓')
    editingId = null
  } else {
    const id = Date.now()
    recipes.push({ ...recipeForm, id, custom: true })
    showToast('Recipe added! ✓')
  }
  localStorage.setItem(STORAGE_KEY, JSON.stringify(recipes))
  recipeForm = emptyRecipeForm()
  activeTab = 'recipes'
  render()
}

function editRecipe(id) {
  const recipe = getCustomRecipes().find(r => r.id === id)
  if (!recipe) return
  editingId = id
  recipeForm = {
    title: recipe.title || '',
    subtitle: recipe.subtitle || '',
    emoji: recipe.emoji || '🥗',
    dieticianId: recipe.dieticianId || 1,
    healthLabels: recipe.healthLabels || [],
    prepTime: recipe.prepTime || '',
    cookTime: recipe.cookTime || '',
    servings: recipe.servings || '',
    gradient: recipe.gradient || GRADIENTS[0].value,
    ingredients: recipe.ingredients && recipe.ingredients.length ? recipe.ingredients : [''],
    instructions: recipe.instructions && recipe.instructions.length ? recipe.instructions : [''],
    note: recipe.note || '',
  }
  activeTab = 'add'
  render()
  window.scrollTo(0, 0)
}

function deleteRecipe(id) {
  if (!confirm('Delete this recipe?')) return
  const recipes = getCustomRecipes().filter(r => r.id !== id)
  localStorage.setItem(STORAGE_KEY, JSON.stringify(recipes))
  render()
}

// ── AUTO-FILL FROM PASTED TEXT ──
function parseRecipeText(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean)
  if (!lines.length) return

  let title = '', subtitle = '', ingredients = [], instructions = [], note = '', prepTime = '', cookTime = '', servings = ''
  let mode = 'title'

  const ingredientKeywords = /^(ingredients|what you need|you('ll| will) need|shopping list)/i
  const instructionKeywords = /^(instructions|method|directions|steps|how to make|preparation|how to)/i
  const noteKeywords = /^(note|tip|chef'?s? note|rd'?s? note|dietitian'?s? note)/i
  const prepKeywords = /prep.{0,10}time|preparation time/i
  const cookKeywords = /cook.{0,10}time|cooking time/i
  const servingsKeywords = /serves?|servings?|portions?/i

  lines.forEach((line, i) => {
    // Extract prep/cook/servings from any line
    if (prepKeywords.test(line)) { prepTime = line.replace(/.*?:/,'').replace(prepKeywords,'').trim(); return }
    if (cookKeywords.test(line)) { cookTime = line.replace(/.*?:/,'').replace(cookKeywords,'').trim(); return }
    if (servingsKeywords.test(line) && /\d/.test(line)) { servings = line.match(/\d+/)?.[0] || ''; return }

    if (i === 0 && mode === 'title') { title = line; return }
    if (i === 1 && mode === 'title' && line.length < 80 && !ingredientKeywords.test(line) && !instructionKeywords.test(line)) { subtitle = line; return }

    if (ingredientKeywords.test(line)) { mode = 'ingredients'; return }
    if (instructionKeywords.test(line)) { mode = 'instructions'; return }
    if (noteKeywords.test(line)) { mode = 'note'; return }

    if (mode === 'ingredients') {
      const clean = line.replace(/^[-•*·▪◦]\s*/, '').replace(/^\d+\.\s*/, '')
      if (clean) ingredients.push(clean)
    } else if (mode === 'instructions') {
      const clean = line.replace(/^[-•*·▪◦]\s*/, '').replace(/^\d+\.\s*/, '')
      if (clean) instructions.push(clean)
    } else if (mode === 'note') {
      note += (note ? ' ' : '') + line
    }
  })

  if (title) recipeForm.title = title
  if (subtitle) recipeForm.subtitle = subtitle
  if (ingredients.length) recipeForm.ingredients = ingredients
  if (instructions.length) recipeForm.instructions = instructions
  if (note) recipeForm.note = note
  if (prepTime) recipeForm.prepTime = prepTime
  if (cookTime) recipeForm.cookTime = cookTime
  if (servings) recipeForm.servings = servings

  showToast('Recipe auto-filled! Check and adjust ✓')
  activeTab = 'add'
  render()
}

function saveRD() {
  const rds = getCustomRDs()
  const id = Date.now()
  rds.push({ ...rdForm, id, custom: true, followers: 0, following: 0, recipeIds: [] })
  localStorage.setItem(RD_STORAGE_KEY, JSON.stringify(rds))
  rdForm = emptyRdForm()
  showToast('Dietitian added! ✓')
  activeTab = 'dieticians'
  render()
}

function deleteRD(id) {
  if (!confirm('Delete this dietitian?')) return
  const rds = getCustomRDs().filter(r => r.id !== id)
  localStorage.setItem(RD_STORAGE_KEY, JSON.stringify(rds))
  render()
}

function showToast(msg) {
  toast = msg
  render()
  setTimeout(() => { toast = null; render() }, 3000)
}

// ── RENDER ──
function render() {
  const app = document.getElementById('app')
  if (!isLoggedIn) { app.innerHTML = renderLogin(); bindLogin(); return }
  app.innerHTML = renderAdmin()
  bindAdmin()
}

function renderLogin() {
  return `
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-leaf">🌿</div>
        <div class="login-title">nuri. admin</div>
        <div class="login-sub">For Emily & Malaika only</div>
        <input class="login-input" type="password" id="pw-input" placeholder="Enter password" />
        <button class="login-btn" id="pw-btn">Enter</button>
        <div class="login-error" id="pw-error" style="display:none">Wrong password. Try again.</div>
      </div>
    </div>
  `
}

function bindLogin() {
  const btn = document.getElementById('pw-btn')
  const input = document.getElementById('pw-input')
  const error = document.getElementById('pw-error')

  function tryLogin() {
    if (input.value === ADMIN_PASSWORD) {
      isLoggedIn = true
      render()
    } else {
      error.style.display = 'block'
      input.value = ''
      input.focus()
    }
  }

  btn.addEventListener('click', tryLogin)
  input.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin() })
  input.focus()
}

function renderAdmin() {
  const customRecipes = getCustomRecipes()
  const customRDs = getCustomRDs()
  const allRDs = [...BUILT_IN_RDS, ...customRDs.map(r => ({ id: r.id, name: r.name, credentials: r.credentials, specialty: r.specialty }))]

  return `
    <nav class="nav">
      <div style="display:flex;align-items:center;gap:10px">
        <span class="nav-logo">nuri.</span>
        <span class="nav-tag">admin panel</span>
      </div>
      <div class="nav-right">
        <a href="index.html" target="_blank"><button class="nav-btn nav-btn-ghost">View app ↗</button></a>
        <button class="nav-btn nav-btn-ghost" onclick="isLoggedIn=false;render()">Sign out</button>
      </div>
    </nav>

    <div class="admin-wrap">
      <div class="admin-header">
        <h1>Recipe Manager</h1>
        <p>Add and manage recipes that appear in the nuri. app — no code needed.</p>
      </div>

      <div class="tabs">
        <button class="tab ${activeTab === 'add' ? 'active' : ''}" onclick="editingId=null;recipeForm=emptyRecipeForm();activeTab='add';render()">➕ ${editingId ? 'Editing Recipe' : 'Add Recipe'}</button>
        <button class="tab ${activeTab === 'paste' ? 'active' : ''}" onclick="activeTab='paste';render()">📋 Paste Recipe</button>
        <button class="tab ${activeTab === 'recipes' ? 'active' : ''}" onclick="activeTab='recipes';render()">🗂 All Recipes (${customRecipes.length})</button>
        <button class="tab ${activeTab === 'dieticians' ? 'active' : ''}" onclick="activeTab='dieticians';render()">👩‍⚕️ Dietitians</button>
        <button class="tab ${activeTab === 'add-rd' ? 'active' : ''}" onclick="activeTab='add-rd';render()">➕ Add Dietitian</button>
      </div>

      ${activeTab === 'add' ? renderAddRecipe(allRDs) : ''}
      ${activeTab === 'paste' ? renderPaste() : ''}
      ${activeTab === 'recipes' ? renderRecipeList(customRecipes, allRDs) : ''}
      ${activeTab === 'dieticians' ? renderRDList(customRDs) : ''}
      ${activeTab === 'add-rd' ? renderAddRD() : ''}
    </div>

    ${toast ? `<div class="toast">${toast}</div>` : ''}
  `
}

function renderAddRecipe(allRDs) {
  return `
  <div class="form-card">

    <div class="form-section">
      <div class="form-section-title">🥗 Recipe Details</div>
      <div class="form-grid">
        <div class="form-group full">
          <label class="form-label">Recipe Title *</label>
          <input class="form-input" id="f-title" placeholder="e.g. PCOS Berry Hormone Bowl" value="${recipeForm.title}" />
        </div>
        <div class="form-group full">
          <label class="form-label">Subtitle</label>
          <input class="form-input" id="f-subtitle" placeholder="e.g. Inositol-rich & anti-androgenic" value="${recipeForm.subtitle}" />
        </div>
        <div class="form-group">
          <label class="form-label">Prep Time</label>
          <input class="form-input" id="f-prep" placeholder="e.g. 10 min" value="${recipeForm.prepTime}" />
        </div>
        <div class="form-group">
          <label class="form-label">Cook Time</label>
          <input class="form-input" id="f-cook" placeholder="e.g. 25 min" value="${recipeForm.cookTime}" />

            <div class="rd-name">${rd.name}</div>

    <div class="form-section">

            onclick="toggleLabel('${l.id}')">${l.label}</div>

      </div>
      <p class="form-hint" style="margin-top:10px">Select all that apply — this determines which filter the recipe appears under.</p>
    </div>

    <div class="form-section">
      <div class="form-section-title">🎨 Card Style</div>
      <label class="form-label" style="display:block;margin-bottom:10px">Emoji</label>
      <div class="emoji-grid" style="margin-bottom:20px">
        ${EMOJIS.map(e => `
          <button class="emoji-btn ${recipeForm.emoji === e ? 'active' : ''}" onclick="recipeForm.emoji='${e}';syncForm();render()">${e}</button>
        `).join('')}
      </div>
      <label class="form-label" style="display:block;margin-bottom:10px">Card Colour</label>
      <div style="display:flex;flex-wrap:wrap;gap:10px">
        ${GRADIENTS.map((g, i) => `
          <div onclick="recipeForm.gradient='${g.value}';syncForm();render()"
            style="width:48px;height:36px;border-radius:8px;cursor:pointer;background:${g.value};border:3px solid ${recipeForm.gradient === g.value ? '#5C3D2E' : 'transparent'};transition:all 0.15s"
            title="${g.label}"></div>
        `).join('')}
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">🧾 Ingredients</div>
      <div id="ingredients-list">
        ${recipeForm.ingredients.map((ing, i) => `
          <div class="list-row">
            <div class="list-dot"></div>
            <input class="form-input list-item-input" id="ing-${i}" placeholder="e.g. 1 cup Greek yogurt" value="${ing}" oninput="recipeForm.ingredients[${i}]=this.value" />
            ${recipeForm.ingredients.length > 1 ? `<button class="remove-btn" onclick="removeIngredient(${i})">×</button>` : ''}
          </div>
        `).join('')}
      </div>
      <button class="add-btn" onclick="addIngredient()">+ Add ingredient</button>
    </div>

    <div class="form-section">
      <div class="form-section-title">📋 Instructions</div>
      <div id="instructions-list">
        ${recipeForm.instructions.map((step, i) => `
          <div class="list-row" style="align-items:flex-start">
            <div class="list-num" style="margin-top:8px">${i+1}</div>
            <textarea class="form-textarea list-item-input" id="step-${i}" placeholder="Describe this step..." oninput="recipeForm.instructions[${i}]=this.value" style="min-height:60px">${step}</textarea>
            ${recipeForm.instructions.length > 1 ? `<button class="remove-btn" style="margin-top:8px" onclick="removeInstruction(${i})">×</button>` : ''}
          </div>
        `).join('')}
      </div>
      <button class="add-btn" onclick="addInstruction()">+ Add step</button>
    </div>

    <div class="form-section">
      <div class="form-section-title">💡 Dietitian's Note</div>
      <div class="form-group">
        <textarea class="form-textarea" id="f-note" placeholder="e.g. Flaxseed is key for oestrogen balance. Eat within 20 minutes of making." style="min-height:80px">${recipeForm.note}</textarea>
        <p class="form-hint">Optional — a science tip or personal note from the RD. This appears at the bottom of the recipe.</p>
      </div>
    </div>

    <div class="submit-row">
      <button class="cancel-btn" onclick="editingId=null;recipeForm=emptyRecipeForm();render()">Clear form</button>
      <button class="submit-btn" id="submit-recipe-btn" onclick="submitRecipe()">${editingId ? 'Save changes ✓' : 'Add to app ✓'}</button>
    </div>

  </div>
  `
}

function renderRecipeList(recipes, allRDs) {
  if (recipes.length === 0) return `
    <div class="form-card">
      <div class="empty-state">
        <div style="font-size:40px;margin-bottom:12px">🌱</div>
        <div style="font-weight:600;margin-bottom:6px">No custom recipes yet</div>
        <div>Use the "Add Recipe" tab to add your first one.</div>
      </div>
    </div>
  `

  return `
    <div class="recipe-list">
      ${recipes.map(r => {
        const rd = allRDs.find(d => d.id == r.dieticianId) || {}
        return `
          <div class="recipe-row">
            <div class="recipe-emoji">${r.emoji || '🥗'}</div>
            <div class="recipe-info">
              <div class="recipe-title">${r.title}</div>
              <div class="recipe-meta">${rd.name || 'Unknown RD'} · ${r.prepTime || '?'} prep · ${r.servings || '?'} servings</div>
              <div class="recipe-tags">
                ${(r.healthLabels || []).map(l => {
                  const label = HEALTH_LABELS.find(h => h.id === l)
                  return label ? `<span class="recipe-tag">${label.label}</span>` : ''
                }).join('')}
              </div>
            </div>
            <span class="recipe-source custom">custom</span>
            <button class="delete-btn" style="border-color:var(--tan);color:var(--tan)" onclick="editRecipe(${r.id})">Edit</button>
            <button class="delete-btn" onclick="deleteRecipe(${r.id})">Delete</button>
          </div>
        `
      }).join('')}
    </div>
  `
}

function renderRDList(rds) {
  if (rds.length === 0) return `
    <div class="form-card">
      <div class="empty-state">
        <div style="font-size:40px;margin-bottom:12px">👩‍⚕️</div>
        <div style="font-weight:600;margin-bottom:6px">No custom dietitians yet</div>
        <div>The 5 built-in RDs are always available. Add more using "Add Dietitian".</div>
      </div>
    </div>
  `
  return `
    <div class="recipe-list">
      ${rds.map(rd => `
        <div class="recipe-row">
          <div style="width:42px;height:42px;border-radius:50%;background:${rd.avatarColor};display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:white;flex-shrink:0">${rd.initials || rd.name.slice(0,2).toUpperCase()}</div>
          <div class="recipe-info">
            <div class="recipe-title">${rd.name}</div>
            <div class="recipe-meta">${rd.credentials} · ${rd.specialty}</div>
          </div>
          <span class="recipe-source custom">custom</span>
          <button class="delete-btn" onclick="deleteRD(${rd.id})">Delete</button>
        </div>
      `).join('')}
    </div>
  `
}

function renderPaste() {
  return `
  <div class="form-card">
    <div class="form-section">
      <div class="form-section-title">📋 Paste a Recipe</div>
      <p style="font-size:14px;color:var(--text-light);margin-bottom:16px;line-height:1.6">
        Copy a recipe from anywhere — a website, notes app, Instagram caption, or just type it out — and paste it below. nuri will auto-fill the form for you.
      </p>
      <textarea class="form-textarea" id="paste-input" placeholder="Paste your recipe here...

Example format:
PCOS Hormone Bowl
Inositol-rich & anti-androgenic

Ingredients
1 cup frozen berries
½ banana
½ cup Greek yogurt

Instructions
1. Blend all ingredients until smooth

Note: Eat within 20 minutes of making." style="min-height:320px;font-size:13px"></textarea>

    <div class="submit-row">
      <button class="cancel-btn" onclick="document.getElementById('paste-input').value=''">Clear</button>
      <button class="submit-btn" onclick="parseRecipeText(document.getElementById('paste-input').value)">Auto-fill form ✨</button>
    </div>
  </div>
  `
}

function renderAddRD() {
  return `
  <div class="form-card">
    <div class="form-section">
      <div class="form-section-title">👩‍⚕️ Dietitian Profile</div>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input class="form-input" id="rd-name" placeholder="e.g. Dr. Sarah Mills" value="${rdForm.name}" oninput="rdForm.name=this.value;autoInitials()" />
        </div>
        <div class="form-group">
          <label class="form-label">Credentials *</label>
          <input class="form-input" id="rd-creds" placeholder="e.g. RD, MSc" value="${rdForm.credentials}" oninput="rdForm.credentials=this.value" />
        </div>
        <div class="form-group full">
          <label class="form-label">Specialty</label>
          <input class="form-input" id="rd-specialty" placeholder="e.g. PCOS & Hormonal Health" value="${rdForm.specialty}" oninput="rdForm.specialty=this.value" />
        </div>
        <div class="form-group full">
          <label class="form-label">Short Bio</label>
          <textarea class="form-textarea" id="rd-bio" placeholder="A short description of who they are and what they specialise in..." oninput="rdForm.bio=this.value">${rdForm.bio}</textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Initials (for avatar)</label>
          <input class="form-input" id="rd-initials" placeholder="e.g. SM" maxlength="2" value="${rdForm.initials}" oninput="rdForm.initials=this.value.toUpperCase()" style="text-transform:uppercase" />
        </div>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">🎨 Avatar Colour</div>
      <div class="color-grid">
        ${AVATAR_COLORS.map(c => `
          <div class="color-swatch ${rdForm.avatarColor === c ? 'active' : ''}"
            style="background:${c}" onclick="rdForm.avatarColor='${c}';render()"></div>
        `).join('')}
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">🏷️ Specialises In</div>
      <div class="label-grid">
        ${HEALTH_LABELS.map(l => `
          <div class="label-chip ${rdForm.tags.includes(l.id) ? 'active' : ''}"
            onclick="toggleRdTag('${l.id}')">${l.label}</div>
        `).join('')}
      </div>
    </div>

    <div class="submit-row">
      <button class="cancel-btn" onclick="rdForm=emptyRdForm();render()">Clear</button>
      <button class="submit-btn" onclick="submitRD()">Add dietitian ✓</button>
    </div>
  </div>
  `
}

// ── ACTIONS ──
function syncForm() {
  // reads from DOM inputs to sync state before re-render
  const fields = ['title','subtitle','prepTime','cookTime','servings','note']
  const ids = ['f-title','f-subtitle','f-prep','f-cook','f-servings','f-note']
  fields.forEach((f, i) => {
    const el = document.getElementById(ids[i])
    if (el) recipeForm[f] = el.value
  })
  // sync ingredients and instructions
  recipeForm.ingredients.forEach((_, i) => {
    const el = document.getElementById(`ing-${i}`)
    if (el) recipeForm.ingredients[i] = el.value
  })
  recipeForm.instructions.forEach((_, i) => {
    const el = document.getElementById(`step-${i}`)
    if (el) recipeForm.instructions[i] = el.value
  })
}

function submitRecipe() {
  syncForm()
  if (!recipeForm.title.trim()) { alert('Please add a recipe title.'); return }
  if (recipeForm.healthLabels.length === 0) { alert('Please select at least one health condition.'); return }
  saveRecipe()
  activeTab = 'recipes'
}

function submitRD() {
  if (!rdForm.name.trim()) { alert('Please add a name.'); return }
  if (!rdForm.credentials.trim()) { alert('Please add credentials.'); return }
  saveRD()
}

function toggleLabel(id) {
  syncForm()
  if (recipeForm.healthLabels.includes(id)) {
    recipeForm.healthLabels = recipeForm.healthLabels.filter(l => l !== id)
  } else {
    recipeForm.healthLabels.push(id)
  }
  render()
}

function toggleRdTag(id) {
  if (rdForm.tags.includes(id)) {
    rdForm.tags = rdForm.tags.filter(t => t !== id)
  } else {
    rdForm.tags.push(id)
  }
  render()
}

function addIngredient() {
  syncForm()
  recipeForm.ingredients.push('')
  render()
  setTimeout(() => {
    const inputs = document.querySelectorAll('[id^="ing-"]')
    if (inputs.length) inputs[inputs.length-1].focus()
  }, 50)
}

function removeIngredient(i) {
  syncForm()
  recipeForm.ingredients.splice(i, 1)
  render()
}

function addInstruction() {
  syncForm()
  recipeForm.instructions.push('')
  render()
  setTimeout(() => {
    const inputs = document.querySelectorAll('[id^="step-"]')
    if (inputs.length) inputs[inputs.length-1].focus()
  }, 50)
}

function removeInstruction(i) {
  syncForm()
  recipeForm.instructions.splice(i, 1)
  render()
}

function autoInitials() {
  const name = document.getElementById('rd-name')?.value || ''
  const parts = name.trim().split(' ').filter(Boolean)
  if (parts.length >= 2) {
    rdForm.initials = (parts[0][0] + parts[parts.length-1][0]).toUpperCase()
  } else if (parts.length === 1) {
    rdForm.initials = parts[0].slice(0,2).toUpperCase()
  }
  rdForm.name = name
  const el = document.getElementById('rd-initials')
  if (el) el.value = rdForm.initials
}

function bindAdmin() {
  // nothing extra needed — all via onclick
}

// ── INIT ──
render()
</script>
</body>
</html>
